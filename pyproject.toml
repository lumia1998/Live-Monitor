[project]
name = "LiveMonitor"
version = "1.0.0"
description = "直播间状态监控提醒服务，支持多平台开播/关播检测、消息推送和 HTTP API 调用"
readme = "README.md"
authors = [{name = "lumia1998"}]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "loguru>=0.7.3",
    "pycryptodome>=3.20.0",
    "distro>=1.9.0",
    "httpx[http2]>=0.28.1",
    "PyExecJS>=1.5.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0"
]

[project.urls]
"Homepage" = "https://github.com/lumia1998/Live-Monitor"
"Documentation" = "https://github.com/lumia1998/Live-Monitor"
"Repository" = "https://github.com/lumia1998/Live-Monitor"
"Issues" = "https://github.com/lumia1998/Live-Monitor/issues"
